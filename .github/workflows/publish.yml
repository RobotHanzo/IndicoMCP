name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify tagged distributions
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.event.release.tag_name }}

  publish:
    name: Publish verified distributions
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/indico-plugin-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
