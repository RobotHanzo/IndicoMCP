name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Matching GitHub release tag for the package being verified.
        type: string
        default: ''

permissions:
  contents: read

env:
  INDICO_CONFIG: /dev/null

jobs:
  build:
    name: Lint and build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Verify release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          expected_tag = f"v{project['version']}"
          tag = os.environ['RELEASE_TAG']
          if tag != expected_tag:
              raise SystemExit(f'Expected release tag {expected_tag!r}, received {tag!r}.')
          PY

      - name: Install build tooling
        run: python -m pip install build twine 'ruff>=0.9'

      - name: Check lint
        run: ruff check --output-format=github .

      - name: Build and check sdist and wheel
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          overwrite: true

  test:
    name: Test wheel (${{ matrix.plugins }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugins: [core, optional]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml

      - name: Install Indico system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      - name: Install the built wheel
        run: python -m pip install dist/*.whl 'pytest>=8'

      - name: Install supported optional plugins
        if: matrix.plugins == 'optional'
        run: |
          python -m pip install \
            'indico-plugin-stsa==0.6.2' \
            'indico-plugin-group-registration==0.7.0' \
            'indico-plugin-sentry==1.1.1'

      - name: Run unit and PostgreSQL integration tests
        working-directory: ${{ runner.temp }}
        env:
          INDICO_MCP_TEST_POSTGRES: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          INDICO_MCP_TEST_ALL_PLUGINS: ${{ matrix.plugins == 'optional' && '1' || '0' }}
        run: pytest -c "$GITHUB_WORKSPACE/pyproject.toml" "$GITHUB_WORKSPACE/tests"
